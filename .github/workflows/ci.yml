name: CI

# push 到任意分支 + 所有 PR 都跑；同 ref 的新跑取消旧跑，避免排队浪费。
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bridge tests (Node 22 / Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/bridge/package-lock.json

      # 可选语音依赖 sherpa-onnx-node / silk-wasm 不在 Linux CI 上安装：
      # sherpa 的预编译二进制按平台分发、体积大（~百 MB），测试不需要；
      # 用 --omit=optional 让安装更轻、更稳定。
      #
      # package-lock.json 里原先有一条 npm 解析不了的可选依赖：
      #   node_modules/sherpa-onnx-node/node_modules/sherpa-onnx-win-arm64
      # 只有 {"optional": true}、没有 version，导致 npm ci / npm install 都直接
      # 报 "Invalid Version" 退出。现在已换成正常的顶层
      #   node_modules/sherpa-onnx-win-arm64（version/resolved/integrity 齐全）
      # 条目，lockfile 与 package.json 同步，直接 npm ci 即可，无需任何补丁。
      - name: Install bridge dependencies
        run: npm ci --prefix packages/bridge --omit=optional

      # test:all 自动发现 packages/bridge/package.json 里所有 test:* 入口；
      # CI=true 时把 Linux 上必然跑不了的套件（需要 Windows chcp / 本机 data/ /
      # 运行中的 DSH / 已安装 DSH / 私有文档 / CRLF 工作区）标成 SKIP 而不是失败，
      # 名单与理由见 packages/bridge/scripts/test-all.mjs 的 CI_SKIP 注释。
      - name: Run full test suite
        run: npm --prefix packages/bridge run test:all
        env:
          CI: 'true'
